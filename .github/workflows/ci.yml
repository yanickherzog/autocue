name: CI

# Minimal foundation, deliberately: format/lint + the two import-boundary/
# color-literal scripts, plus `swift test` per existing package, plus
# `xcodebuild build`/`test` against the real AutoCue.xcworkspace. This exists
# to close a gap flagged in CLAUDE.md/SPEC.md's review history — every
# architecture rule that matters was previously checked manually, once, as a
# milestone acceptance criterion, and never re-verified again. See
# ROADMAP.md, Deliverable D1, and docs/DECISIONS.md for why this is
# introduced now rather than at the old M28 position.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Format, lint, and architecture-boundary checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # PROVISIONAL, pending the result of this exact change (D4/PR #4): was
      # pinned to macos-14/Xcode 15.4 (CLAUDE.md's documented minimum-Xcode
      # floor) since D1 — see the two swift-tools-version/--swiftversion
      # entries in docs/DECISIONS.md for why that pin existed. D4's
      # ACPersistence work hit a fully deterministic SIGTRAP crash in
      # SwiftData relationship handling that reproduces on every Xcode-15.4
      # CI run and on zero local runs under Xcode 26.3, including in a
      # minimal toy @Model reproduction with no connection to this project's
      # real entities, under both `swift test` and `xcodebuild test`. Pinned
      # here to macos-15/Xcode 26.3 (the exact local version, per GitHub's
      # runner-images docs — https://github.com/actions/runner-images) to
      # test directly whether this is a real Xcode-15.4/SwiftData defect
      # rather than a mistake in this project's code. See docs/DECISIONS.md
      # for the outcome once this run completes — if confirmed, this also
      # means CLAUDE.md's minimum-Xcode-floor statement needs updating in
      # the same change, not left silently stale.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (check only, no changes written)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: Import boundary check (CLAUDE.md, Package Dependency Graph)
        run: ./Scripts/check-import-boundaries.sh

      - name: Color literal check (CLAUDE.md, Design System)
        run: ./Scripts/check-color-literals.sh

  test-packages:
    name: swift test — ${{ matrix.package }}
    runs-on: macos-15
    strategy:
      matrix:
        # Explicit list, not an auto-discovered glob: a Deliverable that adds
        # a new package must add it here in the same change. An explicit
        # list makes a forgotten package visible at PR review time; a
        # wildcard would silently skip testing it instead.
        package: [ACCore, ACAudioKit, ACExport, ACPersistence, ACDesignSystem, ACFeatures, ACTestSupport]
    steps:
      - uses: actions/checkout@v4

      # See the `lint` job's "Select Xcode" step comment, above, for why this
      # is macos-15/26.3 rather than macos-14/15.4 — same reasoning, same
      # provisional status, not repeated per job.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  xcodebuild-app:
    name: xcodebuild build/test — AutoCue
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: xcodebuild build
        run: xcodebuild -workspace AutoCue.xcworkspace -scheme AutoCue -destination "platform=macOS" build

      - name: xcodebuild test
        run: xcodebuild -workspace AutoCue.xcworkspace -scheme AutoCue -destination "platform=macOS" test
