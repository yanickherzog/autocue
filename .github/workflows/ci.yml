name: CI

# Minimal foundation, deliberately: format/lint + the two import-boundary/
# color-literal scripts, plus `swift test` per existing package. This exists
# to close a gap flagged in CLAUDE.md/SPEC.md's review history — every
# architecture rule that matters was previously checked manually, once, as a
# milestone acceptance criterion, and never re-verified again. See
# ROADMAP.md, Deliverable D1, and docs/DECISIONS.md for why this is
# introduced now rather than at the old M28 position.
#
# TODO(D1 follow-up, once AutoCue.xcworkspace + the App target exist): add a
# job running `xcodebuild test -scheme AutoCue`. Not added yet because
# neither the workspace nor the App target exists in the repo yet — this
# workflow only covers what's actually buildable today (the standalone SPM
# packages under Packages/).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Format, lint, and architecture-boundary checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Pin a specific Xcode version rather than whatever the runner image
      # defaults to, so this job's result doesn't silently change out from
      # under CI when GitHub updates the macos-14 image's default toolchain.
      # Confirm/adjust this version against the runner image in use the first
      # time this workflow actually executes — it wasn't possible to verify
      # against a live GitHub-hosted runner while writing this file.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (check only, no changes written)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: Import boundary check (CLAUDE.md, Package Dependency Graph)
        run: ./Scripts/check-import-boundaries.sh

      - name: Color literal check (CLAUDE.md, Design System)
        run: ./Scripts/check-color-literals.sh

  test-packages:
    name: swift test — ${{ matrix.package }}
    runs-on: macos-14
    strategy:
      matrix:
        # Explicit list, not an auto-discovered glob: a milestone that adds a
        # new package (ACAudioKit, ACPersistence, ACDesignSystem, ACFeatures,
        # ACTestSupport — see ROADMAP.md) must add it here in the same
        # change. An explicit list makes a forgotten package visible at PR
        # review time; a wildcard would silently skip testing it instead.
        package: [ACCore, ACExport]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test
