name: CI

# Minimal foundation, deliberately: format/lint + the two import-boundary/
# color-literal scripts, plus `swift test` per existing package, plus
# `xcodebuild build`/`test` against the real AutoCue.xcworkspace. This exists
# to close a gap flagged in CLAUDE.md/SPEC.md's review history — every
# architecture rule that matters was previously checked manually, once, as a
# milestone acceptance criterion, and never re-verified again. See
# ROADMAP.md, Deliverable D1, and docs/DECISIONS.md for why this is
# introduced now rather than at the old M28 position.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Format, lint, and architecture-boundary checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Pin a specific Xcode version rather than whatever the runner image
      # defaults to, so this job's result doesn't silently change out from
      # under CI when GitHub updates the macos-14 image's default toolchain.
      # 15.4 was tried first (the macos-14 image's default) and genuinely
      # failed on a real run: its Swift toolchain (5.10) is older than the
      # Package.swift-declared tools-version at the time (6.1), which was
      # never validated against a live runner before that point. Fixed by
      # lowering swift-tools-version to 5.10 in every Package.swift instead
      # of chasing a newer Xcode pin (neither package's manifest used
      # anything newer) — see docs/DECISIONS.md. 15.4 stays pinned
      # deliberately: it's the actual minimum Xcode version CLAUDE.md's
      # "Deployment Target" section documents as required, so CI now
      # validates against that real floor instead of whatever happens to be
      # newest on the runner image.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (check only, no changes written)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: Import boundary check (CLAUDE.md, Package Dependency Graph)
        run: ./Scripts/check-import-boundaries.sh

      - name: Color literal check (CLAUDE.md, Design System)
        run: ./Scripts/check-color-literals.sh

  test-packages:
    name: swift test — ${{ matrix.package }}
    runs-on: macos-14
    strategy:
      matrix:
        # Explicit list, not an auto-discovered glob: a Deliverable that adds
        # a new package must add it here in the same change. An explicit
        # list makes a forgotten package visible at PR review time; a
        # wildcard would silently skip testing it instead.
        package: [ACCore, ACAudioKit, ACExport, ACPersistence, ACDesignSystem, ACFeatures, ACTestSupport]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

      # TEMPORARY diagnostic for D4/PR #4 — not part of this Deliverable's
      # real scope, to be removed once the ACPersistence SIGTRAP crash is
      # actually diagnosed from a real backtrace instead of guessed at.
      # First attempt found only stale, pre-baked VM-image reports (system
      # installer/update logs, shutdown stalls) — no report for the actual
      # crashed test process. `ReportCrash` writes asynchronously and can lag
      # behind the crash itself, so this version waits before searching, and
      # filters to files modified in the last few minutes to cut the noise.
      - name: Dump crash reports on failure (temporary D4 diagnostic)
        if: failure()
        run: |
          echo "Waiting for ReportCrash to finish writing..."
          sleep 20
          for dir in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
            if [ -d "$dir" ]; then
              echo "=== $dir (files modified in the last 10 minutes) ==="
              find "$dir" -type f -newermt '-10 minutes' -print
              for f in $(find "$dir" -type f -newermt '-10 minutes'); do
                echo "--- $f ---"
                cat "$f" || true
              done
            fi
          done

  xcodebuild-app:
    name: xcodebuild build/test — AutoCue
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: xcodebuild build
        run: xcodebuild -workspace AutoCue.xcworkspace -scheme AutoCue -destination "platform=macOS" build

      - name: xcodebuild test
        run: xcodebuild -workspace AutoCue.xcworkspace -scheme AutoCue -destination "platform=macOS" test
